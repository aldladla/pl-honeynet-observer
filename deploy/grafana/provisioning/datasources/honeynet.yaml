apiVersion: 1

deleteDatasources:
  - name: PL Honeynet (safe)
    orgId: 1

datasources:
  - name: PL Honeynet (safe)
    uid: pl-honeynet-postgres
    type: postgres
    access: proxy
    url: db:5432
    user: grafana_reader
    database: honeynet
    isDefault: true
    editable: false
    secureJsonData:
      password: $__env{GRAFANA_DB_PASSWORD}
    jsonData:
      database: honeynet
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 300
