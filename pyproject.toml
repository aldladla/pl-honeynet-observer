[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pl-honeynet-observer"
version = "0.1.0"
description = "Bezpieczny pipeline do analizy telemetrii z własnych sensorów honeypot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "maxminddb>=2.8,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
honeynet = "honeynet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/honeynet"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
